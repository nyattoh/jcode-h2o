[package]
name = "h2o-drift-prototype"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
sdk = ["dep:jcode-sdk", "dep:serde", "dep:serde_json"]

[dependencies]
jcode-sdk = { path = "../../crates/jcode-sdk", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
